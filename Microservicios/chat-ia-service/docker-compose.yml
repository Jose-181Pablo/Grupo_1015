services:
  chat-db:
    image: mariadb:11.8
    container_name: chat-ia-db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: chat_ia_db
      MARIADB_USER: chat_user
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - chat_ia_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  chat-ia-service:
    build: .
    container_name: chat-ia-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:mariadb://chat-db:3306/chat_ia_db
      DB_USERNAME: chat_user
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}

    ports:
      - "8084:8084"

    depends_on:
      chat-db:
        condition: service_healthy

volumes:
  chat_ia_data: