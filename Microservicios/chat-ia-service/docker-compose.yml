services:
  chat-db:
    image: mariadb:11.8
    container_name: chat-ia-db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: chat_ia_db
      MARIADB_USER: chat_user
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3310:3306"

    volumes:
      - chat_ia_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  chat-ia-service:
    build: .
    container_name: chat-ia-service
    restart: unless-stopped

    # La clave de Gemini vive en gemini.env, que no se sube a git
    env_file:
      - path: gemini.env
        required: false

    environment:
      DB_URL: jdbc:mariadb://chat-db:3306/chat_ia_db
      DB_USERNAME: chat_user
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      INMUEBLES_URL: ${INMUEBLES_URL:-http://host.docker.internal:8083}
      TERRENOS_URL: ${TERRENOS_URL:-http://host.docker.internal:8084}

    # Permite llegar a los catálogos que corren en tu equipo (o en otro compose)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8085:8085"

    depends_on:
      chat-db:
        condition: service_healthy

volumes:
  chat_ia_data:
    # Nombre fijo: se usa la misma base aunque se levante desde Microservicios/docker-compose.yml
    name: chat-ia-service_chat_ia_data

# Red compartida con los demás microservicios del equipo
networks:
  default:
    name: grupo1015
