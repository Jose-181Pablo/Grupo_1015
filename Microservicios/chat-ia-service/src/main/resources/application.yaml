spring:
  application:
    name: chat-ia-service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3310/chat_ia_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info


gemini:
  model: ${GEMINI_MODEL:gemini-flash-latest}

# Microservicio de catálogo (inmobiliaria-service de la rama pablo).
catalogo:
  url: ${CATALOGO_URL:http://localhost:8082}
