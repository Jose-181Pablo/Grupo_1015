spring:
  application:
    name: chat-ia-service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/chat_ia_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info