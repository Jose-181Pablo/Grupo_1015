spring:
  application:
    name: chat-ia-service

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3310/chat_ia_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info


gemini:
  model: ${GEMINI_MODEL:gemini-flash-latest}

# Microservicios de catálogo de la rama pablo: casas (inmuebles-service) y terrenos (terrenos-service).
catalogo:
  inmuebles-url: ${INMUEBLES_URL:http://localhost:8083}
  terrenos-url: ${TERRENOS_URL:http://localhost:8084}
