<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Inmueble</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h1 class="mb-4">Datos del Inmueble</h1>

<form th:action="@{/guardar}" th:object="${inmueble}" method="post" class="w-50">

    <div class="mb-3">
        <label class="form-label">ID / Código:</label>
        <input type="text" th:field="*{id}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Título:</label>
        <input type="text" th:field="*{titulo}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción:</label>
        <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Guardar Inmueble</button>
    <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
</form>

</body>
</html>
