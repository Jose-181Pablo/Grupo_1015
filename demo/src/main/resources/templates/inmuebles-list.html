<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Inmuebles</title>
    <!-- Agregamos Bootstrap básico para que se vea profesional -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h1 class="mb-4">Catálogo de Inmuebles</h1>

<!-- Botón para crear un nuevo inmueble -->
<a th:href="@{/nuevo}" class="btn btn-primary mb-3">Agregar Nuevo Inmueble</a>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <!-- Aquí ocurre la magia de Thymeleaf: iteramos sobre la lista de inmuebles -->
    <tr th:each="inmueble : ${inmuebles}">
        <td th:text="${inmueble.id}"></td>
        <td th:text="${inmueble.titulo}"></td>
        <td th:text="${inmueble.descripcion}"></td>
        <td th:text="'$' + ${inmueble.precio}"></td>
        <td>
            <!-- Botones de Acción -->
            <a th:href="@{/editar/{id}(id=${inmueble.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/eliminar/{id}(id=${inmueble.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este inmueble?');">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
