services:

  mariadb:
    image: mariadb:lts
    container_name: grupo1015-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: citas_db
      MARIADB_USER: grupo1015
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  microservicio-citas:
    build: ./microservicio-citas/microservicio-citas
    container_name: microservicio-citas
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/citas_db
      DB_USER: grupo1015
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      mariadb:
        condition: service_healthy

  microservicio-ofertas:
    build: ./microservicio-ofertas
    container_name: microservicio-ofertas
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/ofertas_db
      DB_USER: grupo1015
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data: