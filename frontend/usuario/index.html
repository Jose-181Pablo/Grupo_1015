<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta de usuario | Grupo 10.15</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="encabezado">
    <a class="marca" href="../../index.html">Grupo 10.15</a>
    <!-- Muestra el rol actual: INVITADO, USUARIO o ADMIN -->
    <span id="rol-actual" class="etiqueta-rol">INVITADO</span>
</header>

<main class="contenedor">

    <!-- 1. Panel de acceso: se ve mientras la persona es INVITADO -->
    <section id="panel-acceso" class="tarjeta">
        <h1>Tu cuenta</h1>
        <p class="texto-suave">Crea tu cuenta o inicia sesión para continuar.</p>

        <div class="pestanas">
            <button type="button" class="pestana activa" data-formulario="form-registro">Crear cuenta</button>
            <button type="button" class="pestana" data-formulario="form-login">Iniciar sesión</button>
        </div>

        <!-- Formulario de registro: POST /api/auth/registro -->
        <form id="form-registro" class="formulario" novalidate>
            <div class="fila">
                <label>Nombre
                    <input type="text" name="nombre" autocomplete="given-name" required>
                </label>
                <label>Apellido
                    <input type="text" name="apellido" autocomplete="family-name" required>
                </label>
            </div>
            <label>Correo
                <input type="email" name="correo" autocomplete="email" required>
            </label>
            <label>Contraseña
                <input type="password" name="password" autocomplete="new-password" required>
            </label>
            <label>Confirmar contraseña
                <input type="password" name="confirmar" autocomplete="new-password" required>
            </label>
            <button type="submit" class="boton">Crear cuenta</button>
        </form>

        <!-- Formulario de inicio de sesión: POST /api/auth/login -->
        <form id="form-login" class="formulario oculto" novalidate>
            <label>Correo
                <input type="email" name="correo" autocomplete="email" required>
            </label>
            <label>Contraseña
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" class="boton">Iniciar sesión</button>
        </form>

        <!-- Aquí aparecen los mensajes de error o de éxito -->
        <p id="mensaje" class="mensaje oculto" role="alert"></p>

        <button type="button" id="boton-invitado" class="enlace">Continuar como invitado</button>
    </section>

    <!-- 2. Panel de sesión: se ve cuando ya se detectó el rol -->
    <section id="panel-sesion" class="tarjeta oculto">
        <p class="texto-suave" id="sesion-correo"></p>
        <h1 id="sesion-titulo"></h1>
        <p id="sesion-mensaje"></p>
        <div class="acciones">
            <a id="boton-continuar" class="boton" href="../../index.html">Ir al sitio</a>
            <button type="button" id="boton-salir" class="boton boton-secundario">Cerrar sesión</button>
        </div>
    </section>

</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
