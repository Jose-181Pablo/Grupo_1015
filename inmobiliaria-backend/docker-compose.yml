# Levanta todo con:  docker compose up -d --build
# Apaga todo con:    docker compose down        (agrega -v para borrar también las bases de datos)
#
# Eureka ya NO se levanta aquí: se usa el Eureka compartido del equipo
# (rama aldo, Microservicios/eureka-server). Levántalo primero para que los servicios se registren.
# Todos los compose del equipo usan la red "grupo1015", así se encuentran por nombre.
#
# Puertos asignados por el equipo: 8761 Eureka (compartido) · 8083 inmuebles (catálogo) · 8084 terrenos
# Cada microservicio tiene SU PROPIA base de datos.
services:

  postgres-inmuebles:
    image: postgres:17
    container_name: postgres-inmuebles
    environment:
      POSTGRES_DB: inmuebles_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 en tu compu, para no chocar con un PostgreSQL instalado en Windows
    volumes:
      - datos-inmuebles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inmuebles_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-terrenos:
    image: postgres:17
    container_name: postgres-terrenos
    environment:
      POSTGRES_DB: terrenos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"   # 5434 en tu compu
    volumes:
      - datos-terrenos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terrenos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  inmuebles-service:
    build: ./inmuebles-service
    container_name: inmuebles-service
    ports:
      - "8083:8083"
    environment:
      # Dentro de Docker los contenedores se encuentran por su nombre, no por "localhost"
      DB_URL: jdbc:postgresql://postgres-inmuebles:5432/inmuebles_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres-inmuebles:
        condition: service_healthy

  terrenos-service:
    build: ./terrenos-service
    container_name: terrenos-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres-terrenos:5432/terrenos_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_URL: http://eureka-server:8761/eureka/
      OFERTAS_URL: http://host.docker.internal:8087/api/ofertas
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-terrenos:
        condition: service_healthy

volumes:
  datos-inmuebles:
  datos-terrenos:

# Red compartida con los demás microservicios del equipo (Eureka, gateway, chat, usuario...)
networks:
  default:
    name: grupo1015
