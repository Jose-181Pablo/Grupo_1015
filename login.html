<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Grupo 10.15</title>
    <meta name="description" content="Accede a tu cuenta de Grupo 10.15.">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Barra superior sencilla: logo y regreso a la página principal -->
    <header class="login-barra">
        <a href="index.html" class="login-logo">
            <img src="assets/images/logo.png" alt="Grupo 10.15">
        </a>
        <a href="index.html" class="login-volver">&larr; Volver al inicio</a>
    </header>

    <main class="login-contenedor">
        <section class="login-tarjeta">
            <span class="login-subtitulo">Acceso</span>
            <h1>Iniciar sesión</h1>
            <p class="login-texto">Escribe tu correo y tu contraseña para entrar a tu cuenta.</p>

            <!-- POST /api/auth/login (microservicio autenticacion) -->
            <form id="form-login" class="login-formulario" novalidate>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email"
                       placeholder="tucorreo@ejemplo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password"
                       placeholder="Tu contraseña" required>

                <!-- Aquí aparecen los mensajes de error o de éxito -->
                <p id="mensaje" class="login-mensaje oculto" role="alert"></p>

                <button type="submit" class="login-boton">Iniciar sesión</button>
            </form>

            <p class="login-registro">
                ¿No tienes cuenta?
                <a href="frontend/usuario/index.html">Regístrate</a>
            </p>
        </section>

        <a href="index.html" class="login-volver-abajo">Regresar a la página principal</a>
    </main>

    <!-- api.js ya existe: tiene iniciarSesion(), validarSesion() y guardarToken() -->
    <script src="frontend/usuario/js/api.js"></script>
    <script src="login.js"></script>
</body>
</html>
