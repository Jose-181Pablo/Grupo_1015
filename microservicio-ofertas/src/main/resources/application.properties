spring.application.name=microservicio-ofertas

server.port=${PORT:8087}

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/ofertas_db}
spring.datasource.username=${DB_USER:grupo1015}
spring.datasource.password=${DB_PASSWORD:grupo1015}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always