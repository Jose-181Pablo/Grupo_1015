spring.application.name=autenticacion
server.port=8082

# Lee las variables del archivo .env (no se sube a GitHub), igual que en usuario.
# Se buscan dos rutas porque IntelliJ ejecuta desde la raiz del repositorio
# y Maven desde la carpeta del microservicio.
spring.config.import=optional:file:.env[.properties],optional:file:microservicios/autenticacion/.env[.properties]

# Base de datos propia (MariaDB en Docker, ver docker-compose.yml)
spring.datasource.url=jdbc:mariadb://localhost:3309/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: crea/actualiza la tabla automaticamente a partir de la clase Credencial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
