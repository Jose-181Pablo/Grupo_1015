spring.application.name=usuario
server.port=8081

# Lee las variables del archivo .env (no se sube a GitHub).
# Se buscan dos rutas porque IntelliJ ejecuta desde la raiz del repositorio
# y Maven desde la carpeta del microservicio. En Docker no hay .env:
# ahi las variables las pasa docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:microservicios/usuario/.env[.properties]

# Base de datos (MariaDB en Docker, ver docker-compose.yml)
spring.datasource.url=jdbc:mariadb://localhost:3308/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA: crea/actualiza la tabla automaticamente a partir de la clase Usuario
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
